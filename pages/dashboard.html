<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Restaurante XYZ</title>
    <link rel="stylesheet" href="../css/main.css" />
</head>

<body>

    <div class="app-layout">

        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M3 11H21M3 11C3 7 6 4 12 4C18 4 21 7 21 11M3 11V17C3 19 4 20 6 20H18C20 20 21 19 21 17V11"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M9 20V17C9 15.5 10 15 12 15C14 15 15 15.5 15 17V20" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <span>Restaurante XYZ</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7" />
                        <rect x="14" y="3" width="7" height="7" />
                        <rect x="14" y="14" width="7" height="7" />
                        <rect x="3" y="14" width="7" height="7" />
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a href="reservas.html" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                        <line x1="16" y1="2" x2="16" y2="6" />
                        <line x1="8" y1="2" x2="8" y2="6" />
                        <line x1="3" y1="10" x2="21" y2="10" />
                    </svg>
                    <span>Reservas</span>
                </a>
                <a href="productos.html" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" />
                        <line x1="3" y1="6" x2="21" y2="6" />
                        <path d="M16 10a4 4 0 01-8 0" />
                    </svg>
                    <span>Productos</span>
                </a>
                <a href="pedidos.html" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
                        <polyline points="14 2 14 8 20 8" />
                        <line x1="16" y1="13" x2="8" y2="13" />
                        <line x1="16" y1="17" x2="8" y2="17" />
                        <polyline points="10 9 9 9 8 9" />
                    </svg>
                    <span>Pedidos</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                
                <button class="btn btn-danger btn-full" id="btn-logout">
                    Cerrar sesión
                </button>
            </div>
        </aside>

        <div class="main-content">

            <header class="topbar">
                <div class="topbar-left">
                    <h1 class="page-title">Dashboard</h1>
                    <p class="page-subtitle">Bienvenido al sistema de gestión</p>
                </div>
                <div class="topbar-right">
                    <div class="user-info">
                        <span id="user-nombre" class="user-nombre"></span>
                        <span id="user-rol" class="badge badge-secondary"></span>
                    </div>
                </div>
            </header>

            <main class="page-content">
                <div class="cards-grid">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">Reservas de hoy</h3>
                        </div>
                        <div class="card-body">
                            <p class="stat-number" id="stat-reservas">-</p>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">Mesas disponibles</h3>
                        </div>
                        <div class="card-body">
                            <p class="stat-number" id="stat-mesas">-</p>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">Pedidos pendientes</h3>
                        </div>
                        <div class="card-body">
                            <p class="stat-number" id="stat-pedidos">-</p>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">Productos en menú</h3>
                        </div>
                        <div class="card-body">
                            <p class="stat-number" id="stat-productos">-</p>
                        </div>
                    </div>
                </div>
            </main>

        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/core/app.js"></script>
    <script src="../js/core/sesion.guard.js"></script>
    <script src="../js/services/api.service.js"></script>
    <script src="../js/services/auth.service.js"></script>
    <script src="../js/services/ui.service.js"></script>
    <script src="../js/services/reservas.service.js"></script>
    <script src="../js/services/productos.service.js"></script>
    <script src="../js/services/pedidos.service.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {

            if (!SesionGuard.check()) return;

            const usuario = SesionGuard.getUser();
            if (usuario) {
                document.getElementById('user-nombre').textContent = usuario.nombre;
                document.getElementById('user-rol').textContent = usuario.rol;
            }

            document.getElementById('btn-logout').addEventListener('click', async () => {
                await AuthService.logout();
                SesionGuard.clearSession();
                window.location.href = '../index.html';
            });

            const resReservas = await ReservasService.listarReservas();
            const resMesas = await ReservasService.listarMesas();
            const resPedidos = await PedidosService.listarPorEstado('pendiente');
            const resProductos = await ProductosService.listar();

            if (resReservas?.ok) document.getElementById('stat-reservas').textContent = resReservas.data.data.length;
            if (resMesas?.ok) document.getElementById('stat-mesas').textContent = resMesas.data.data.filter(m => m.estado === 'disponible').length;
            if (resPedidos?.ok) document.getElementById('stat-pedidos').textContent = resPedidos.data.data.length;
            if (resProductos?.ok) document.getElementById('stat-productos').textContent = resProductos.data.data.length;

        });
    </script>

</body>

</html>
